<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inline style</title>
<style>.inl-low { color: #cccccc; } .inl-good { color: #000000; }</style>
</head>
<body>
<header><nav><a href="/" class="nav">Home</a></nav></header>
<main>
<h1>Inline style</h1>
<p class="inl-good">Black on white.</p>
<p class="inl-low">Pale grey on white.</p>
<p style="color:#dddddd">Style attribute, pale.</p>
</main>
<footer><a href="/" class="nav">Home</a></footer>
</body>
</html>
